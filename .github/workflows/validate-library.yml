name: Validate executable storyboard library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate source templates and index
        run: python skills/douyin-simple-comic-workflow/scripts/check_executable_templates.py --root skills/douyin-simple-comic-workflow/references/comic-layouts --output "$RUNNER_TEMP/template-contract.json" --check-index
      - name: Verify native geometry and rejection cases
        run: python skills/douyin-simple-comic-workflow/scripts/verify_template_library.py --root skills/douyin-simple-comic-workflow/references/comic-layouts --output "$RUNNER_TEMP/sb-geometry"
