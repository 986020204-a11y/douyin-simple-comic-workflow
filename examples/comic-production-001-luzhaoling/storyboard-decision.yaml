- page_id: P08
  layout_id: SB-035
  main_focus: 车内擦手、扯衣露黑印与车外朱明浩叫嚣
  narrative_function: 用黑印的可见证据巩固救命交易并留下冲突钩子
  source_text: 马车里，陆昭菱靠坐在一角，看着眼前的男人拿着一条手帕，仔细地擦着手，动作优雅。刚才他的手掐过她的脖子，这是嫌脏了。她忍着恶心作呕，“这个交易你不吃亏，毕竟你这条命很贵重，没我救你，你活不了几年。”晋王周时阅淡淡地瞥了她一眼，“你倒是先说说，本王哪里需要你救？”陆昭菱突然动作极快地朝他扑了过来，伸手抓住他的衣襟蓦地一扯。嘶啦。周时阅的衣襟被拉开，露出了锁骨和一片胸膛！他瞳孔一缩，再次掐住了她纤细的脖子，“想死？”雪白的胸膛上，一个诡异的黑色印记赫然出现，像是隐在皮肤之下的怪物。陆昭菱的手指戳了上去，那个黑色印记竟然仿似有生命一样，缩了一缩，颜色瞬间浅了几分。“咳咳，确定不需要我救吗？”外面传来了朱明浩的叫声，“晋王！我是青福侯府的朱明浩！那个丫头是我小妾，你快把人交出来！”朱明浩一开始听到晋王也吓了一跳，但很快就回过神来，就算是晋王也不能当街跟他抢女人啊！传到太后面前，太后肯定是护着他，谁不知道太后不喜欢晋王？
  layout_name: Cross-Cutting Parallel Action
