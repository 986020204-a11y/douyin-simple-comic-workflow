schema_version: 0.2-draft
purpose: layout_id to bubble candidates and placement constraints
source_boundary: Only claims explicit wording found in bundled SB descriptions. All
  adaptation_rule entries are additions for this workflow.
audit_contract:
  validator: scripts/audit_layout_bubbles.py
  required_index_count: 68
  required_description_files: SB-001.md through SB-068.md
  source_dimensions:
  - bubble_shape
  - bubble_position
  - tail
  - text_whitespace
  - text_semantics
  reference_limitations:
  - Preview-only appearance is not treated as recovered source wording.
  - source_rule_level=none means generic type and placement rules only.
  - preferred_bubble_candidates are shared workflow candidates, not claims of unique gallery artwork.
profiles:
- layout_id: SB-001
  layout_name_en: Regular Grid
  source_file: references/comic-layouts/SB-001.md
  panel_count: variable
  layout_structure: panels of equal size arranged neatly in a consistent reading order,
    ideal for slice-of-life and dialogue-driven stories.
  source_evidence: 源说明明确写出适合 dialogue-driven stories；未说明具体气泡形状或尾巴。
  source_rule_level: explicit
  visual_reference_only: true
  preferred_bubble_candidates:
  - rounded_speech
  - narration_box
  adaptation_rule: 新增适配：先按文字类型与情绪选择候选，再用当前底图的实际留白、说话者区域、载体区域和避让区域决定最终尺寸/位置；不把候选样式宣称为原画廊独有造型。
  placement_constraints:
  - anchor must be explicit pixel rect with rect_format and panel_id
  - compact body follows text content; do not span the whole panel unless whitespace
    requires it
  - speech/thought tail or connector only when the same-panel speaker_region is confirmed
  - recheck body, tail/connector and later blocks against face, main_action, key_object
    and other text
  - if no safe fit remains, keep needs-placement and do not shrink text below readable
    size
