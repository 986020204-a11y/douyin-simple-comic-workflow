schema_version: '1.0'
purpose: Workflow-authored executable bubble constraints paired with the 68 bundled
  SB references.
source_boundary: visual_reference_only=true means the SB description/preview is not
  executable source geometry; execution fields are an explicit workflow adaptation.
required_fields:
- bubble_style
- bubble_bounds
- allowed_zone
- max_width
- tail_anchor
- speaker_direction
- text_type
- fallback
profiles:
- layout_id: SB-001
  profile_id: SB-001-bubble-execution-v1
  visual_reference_only: true
  executable: true
  source: workflow-adaptation
  source_rule_level: explicit
  bubble_style: profile_preference
  preferred_bubble_candidates:
  - rounded_speech
  - narration_box
  bubble_bounds:
    mode: compact_within_anchor
    coordinate_space: canvas_px
    min_width: 150
    min_height: 72
  allowed_zone:
    kind: panel_whitespace
    coordinate_space: panel
    margin_px: 24
    requires_explicit_anchor: true
  max_width:
    value: 0.92
    unit: anchor_fraction
  tail_anchor: speaker_region
  speaker_direction: toward_speaker
  text_type: semantic_type
  fallback:
    policy: needs_review
    reason: bubble_execution_profile_missing_or_anchor_outside_allowed_zone
