    text_semantics:
      status: explicit
      source_lines:
      - 'Comic storyboard. Layout: Regular Grid, panels of equal size arranged neatly
        in a consistent reading order, ideal for slice-of-life and dialogue-driven
        stories. Let this storyboard mechanism determine the page structure, reading
        flow, panel hierarchy, and pacing; output a complete single-page comic where
        panels tell a continuous story with consistent characters.'
